<div style="padding: 40px; font-family: sans-serif;">
  
  <!-- CABECERA: Título y Contador del carrito -->
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
    <h2 style="font-size: 1.5rem; margin: 0;">Catálogo Completo</h2>
    <div style="background: #111; color: white; padding: 10px 20px; border-radius: 5px; font-weight: bold;">
      🛒 En carrito: {{ carrito.length }} productos
    </div>
  </div>
  
  <!-- LA CUADRÍCULA DE TUS PRODUCTOS -->
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px;">
    @for (producto of productos; track producto.id) {
      <div style="border: 1px solid #eee; padding: 15px; text-align: center; transition: transform 0.2s;">
        <img [src]="producto.imagen || 'assets/placeholder.jpg'" alt="{{ producto.nombre }}" style="width: 100%; height: 250px; object-fit: contain; margin-bottom: 15px;">
        
        <p style="color: #888; font-size: 12px; margin: 0; text-transform: uppercase;">{{ producto.marca }}</p>
        <h3 style="font-size: 14px; margin: 5px 0;">{{ producto.nombre }}</h3>
        <p style="font-size: 12px; color: #555;">{{ producto.categoria }}</p>
        <p style="font-weight: bold; font-size: 16px; margin: 10px 0;">S/ {{ producto.precio }}</p>
        
        <!-- ESTE ES EL BOTÓN QUE AGREGA EL PRODUCTO -->
        <button (click)="agregarAlCarrito(producto)" style="width: 100%; padding: 10px; background: #e50046; color: white; border: none; font-weight: bold; cursor: pointer;">
          AGREGAR AL CARRITO
        </button>
      </div>
    }
  </div>

  
  
</div>
