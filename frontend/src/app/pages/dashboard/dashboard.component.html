<!-- PANEL DASHBOARD -->
<div class="dashboard-container" style="padding: 20px;">
  
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2>Panel de Administración ({{ totalProducts }} productos)</h2>
    <button (click)="logout()" style="padding: 8px 15px; background-color: #333; color: white; border: none; cursor: pointer;">Cerrar Sesión</button>
  </div>

  
<!-- FORMULARIO DE PRODUCTO CON VALIDACIONES DE ANGULAR -->
  <div class="form-card" style="background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
    <h3>{{ isEditing ? 'Editar Producto' : 'Nuevo Producto' }}</h3>
    
    <!-- La etiqueta form envuelve los inputs y maneja el estado general con #productoForm -->
    <form #productoForm="ngForm" (ngSubmit)="saveProduct()">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        
        <!-- Marca (Obligatorio) -->
        <div>
          <input type="text" name="marca" [(ngModel)]="currentProduct.marca" #marca="ngModel" required placeholder="Marca (ej. Nike)" style="padding: 8px; width: 100%; box-sizing: border-box;">
          <small *ngIf="marca.invalid && marca.touched" style="color: red; display: block; margin-top: 5px;">La marca es obligatoria.</small>
        </div>

        <!-- Nombre (Obligatorio) -->
        <div>
          <input type="text" name="nombre" [(ngModel)]="currentProduct.nombre" #nombre="ngModel" required placeholder="Nombre (ej. Air Force 1)" style="padding: 8px; width: 100%; box-sizing: border-box;">
          <small *ngIf="nombre.invalid && nombre.touched" style="color: red; display: block; margin-top: 5px;">El nombre es obligatorio.</small>
        </div>

        <!-- Precio (Obligatorio y mayor a 0) -->
        <div>
          <input type="number" name="precio" [(ngModel)]="currentProduct.precio" #precio="ngModel" required min="1" placeholder="Precio (S/)" style="padding: 8px; width: 100%; box-sizing: border-box;">
          <small *ngIf="precio.invalid && precio.touched" style="color: red; display: block; margin-top: 5px;">Ingresa un precio válido mayor a 0.</small>
        </div>

        <!-- Categoría (Obligatorio) -->
        <div>
          <select name="categoria" [(ngModel)]="currentProduct.categoria" #categoria="ngModel" required style="padding: 8px; width: 100%; box-sizing: border-box;">
            <option value="">Selecciona Categoría</option>
            <option value="caballeros">Caballeros</option>
            <option value="damas">Damas</option>
            <option value="infantil">Infantil</option>
          </select>
          <small *ngIf="categoria.invalid && categoria.touched" style="color: red; display: block; margin-top: 5px;">Selecciona una categoría.</small>
        </div>

        <div style="grid-column: span 2;">
          <input type="text" name="descripcion" [(ngModel)]="currentProduct.descripcion" placeholder="Descripción breve" style="padding: 8px; width: 100%; box-sizing: border-box;">
        </div>
        
        <div style="grid-column: span 2;">
          <label>Imagen Local:</label>
          <input type="file" id="fileUpload" (change)="onFileSelected($event)" accept="image/*" style="display: block; margin-top: 5px;">
        </div>
      </div>

      <div style="margin-top: 15px; display: flex; gap: 10px;">
        <!-- El botón se deshabilita y se pone transparente si el formulario es inválido -->
        <button type="submit" [disabled]="productoForm.invalid" [style.opacity]="productoForm.invalid ? '0.5' : '1'" style="padding: 10px 20px; background-color: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px;">
          {{ isEditing ? 'Actualizar' : 'Guardar' }}
        </button>
        <button type="button" *ngIf="isEditing" (click)="resetForm(); productoForm.resetForm()" style="padding: 10px 20px; background-color: #6c757d; color: white; border: none; cursor: pointer; border-radius: 4px;">
          Cancelar
        </button>
      </div>
    </form>
  </div>

  <!-- BARRA DE BÚSQUEDA Y TABLA -->
  <div style="margin-bottom: 20px; display: flex; gap: 10px;">
    <input 
      type="text" 
      [(ngModel)]="terminoBusqueda" 
      (ngModelChange)="buscarProducto()" 
      placeholder="Escribe para buscar en tiempo real..." 
      style="padding: 10px; width: 300px; border-radius: 4px; border: 1px solid #ccc;"
    >
  </div>

 <!-- COMUNICACIÓN ENTRE COMPONENTES (@Input y @Output) -->
<app-product-list 
  [productos]="products" 
  (cambiarEstado)="toggleVisibility($event)" 
  (editar)="editProduct($event)" 
  (borrar)="deleteProduct($event)">
</app-product-list>
</div>
