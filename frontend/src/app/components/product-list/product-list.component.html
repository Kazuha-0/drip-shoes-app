<div class="table-card">
  <table style="width: 100%; border-collapse: collapse; text-align: left;">
    <thead>
      <tr style="border-bottom: 2px solid #ccc;">
        <th style="padding: 10px;">Imagen</th>
        <th style="padding: 10px;">Marca</th>
        <th style="padding: 10px;">Nombre</th>
        <th style="padding: 10px;">Categoría</th>
        <th style="padding: 10px;">Precio</th>
        <th style="padding: 10px;">Estado</th>
        <th style="padding: 10px;">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let p of productos" style="border-bottom: 1px solid #eee;">
        <td style="padding: 10px;">
          <img [src]="p.imagen" alt="Img" width="50" style="border-radius: 4px;" *ngIf="p.imagen">
        </td>
        <td style="padding: 10px;">{{ p.marca }}</td>
        <td style="padding: 10px;">{{ p.nombre }}</td>
        <td style="padding: 10px;">{{ p.categoria }}</td>
        <td style="padding: 10px;">S/ {{ p.precio }}</td>
        <td style="padding: 10px;">
          <span [style.color]="p.visible ? 'green' : 'red'">
            {{ p.visible ? 'Público' : 'Oculto' }}
          </span>
        </td>
        <td style="padding: 10px; display: flex; gap: 5px; align-items: center; height: 100%;">
          <!-- Usamos .emit() para enviar la señal al padre -->
          <button (click)="cambiarEstado.emit(p)" style="padding: 5px 10px; background-color: #fd7e14; color: white; border: none; border-radius: 3px; cursor: pointer;">
            {{ p.visible ? 'Ocultar' : 'Mostrar' }}
          </button>
          <button (click)="editar.emit(p)" style="padding: 5px 10px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;">
            Editar
          </button>
          <button (click)="borrar.emit(p.id)" style="padding: 5px 10px; background-color: #dc3545; color: white; border: none; border-radius: 3px; cursor: pointer;">
            Borrar
          </button>
        </td>
      </tr>
      <tr *ngIf="productos.length === 0">
        <td colspan="7" style="text-align: center; padding: 20px;">No se encontraron productos.</td>
      </tr>
    </tbody>
  </table>
</div>
