spring.application.name=backend

# Puerto: en produccion lo asigna el servidor, en local usa 8080
server.port=${PORT:8080}

# Conexion a Supabase (valores leidos de variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Clave para firmar los tokens JWT
jwt.secret=${JWT_SECRET}

# Dominios que pueden llamar a la API (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
