services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        CONFIG: development
    ports:
      - "4200:80"
    depends_on:
      - backend
